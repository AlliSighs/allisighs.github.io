<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <!-- FAVICONS & SEO -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/siteicon.png">
    <link rel="apple-touch-icon" href="/siteicon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allisighs tools // discord role icons downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/main.js"></script>
    <style>
        .dd-opt { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .dd-opt:hover { background: rgba(204, 255, 0, 0.1); }
        .g-icon { width: 32px; height: 32px; border-radius: 50%; background: #222; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .grid-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; }
        .preview-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .preview-item:hover { border-color: #ccff00; background: rgba(255,255,255,0.1); }
        .preview-img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 8px; border-radius: 4px; background: rgba(0,0,0,0.3); }
        .preview-name { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #ccc; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
    </style>
</head>
<body class="lowercase min-h-screen relative overflow-hidden selection:bg-lime selection:text-black font-sans antialiased bg-black">
    
    <div id="system-loader">
        <div class="w-32 h-1 bg-gray-800 rounded overflow-hidden">
            <div class="h-full bg-lime w-1/2 animate-[blob_2s_infinite]"></div>
        </div>
    </div>

    <!-- ОКНО АВТОРИЗАЦИИ (ДОБАВЛЕНО) -->
    <div id="discord-auth-overlay" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-dark border border-white/10 p-8 rounded-2xl shadow-2xl relative">
            <h2 class="text-2xl font-black text-white mb-2 text-center">discord authorization</h2>
            <p class="text-gray-500 font-mono text-xs mb-6 text-center">введи токен своего аккаунта. он будет сохранен локально для всех дискорд-утилит.</p>
            <input type="password" id="discord-token-input" placeholder="OTk..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono mb-4 focus:border-lime outline-none text-center transition-all">
            <button id="discord-auth-btn" onclick="submitDiscordToken()" class="w-full bg-lime text-black font-bold py-3 rounded-lg hover:bg-white transition-colors">войти</button>
        </div>
    </div>

    <header class="fixed top-0 w-full z-40 px-6 h-16 flex justify-between items-center border-b border-white/5 bg-black/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <a href="../../../" class="flex items-center gap-2 text-gray-400 hover:text-lime transition-colors">
                <span class="material-symbols-rounded text-[24px]">arrow_back</span>
                <span class="font-mono font-bold tracking-tight">назад</span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div id="discord-profile"></div>
            <div class="w-px h-6 bg-white/10"></div>
            <div class="flex items-center gap-3">
                <span id="user-greeting" class="font-mono text-sm text-lime">...</span>
                <button onclick="logout()" class="text-gray-600 hover:text-white transition-colors"><span class="material-symbols-rounded text-[20px]">logout</span></button>
            </div>
        </div>
    </header>

    <div class="pt-20 px-4 h-screen flex flex-col md:flex-row gap-4 pb-4">
        <div class="w-full md:w-[350px] bg-dark border border-white/10 rounded-xl flex flex-col p-5 shrink-0 z-20 relative bg-black h-fit">
            <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-4">
                <div>
                    <h2 class="text-xl font-black text-white leading-none">иконки ролей</h2>
                    <div class="text-xs text-lime font-mono mt-1">парсер</div>
                </div>
                <button onclick="RoleApp.fetchGuilds()" class="p-2 bg-white/5 rounded-lg hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
                    <span class="material-symbols-rounded text-xl" id="refresh-icon">sync</span>
                </button>
            </div>

            <div class="space-y-4">
                <div class="relative group">
                    <label class="block text-xs font-mono text-gray-500 mb-2">выбери сервер</label>
                    <div onclick="RoleApp.toggleDD()" class="bg-black border border-white/20 p-3 rounded-lg text-white cursor-pointer flex justify-between items-center hover:border-lime transition-colors" id="guild_disp">
                        <span class="italic text-gray-600 text-xs">список серверов...</span>
                        <span class="material-symbols-rounded text-sm">arrow_drop_down</span>
                    </div>
                    <div id="guild_dd" class="absolute top-full left-0 w-full bg-dark border border-white/20 rounded-lg mt-1 max-h-60 overflow-y-auto hidden z-50 shadow-2xl"></div>
                </div>

                <div class="p-4 bg-white/5 rounded-lg border border-white/5">
                    <div class="flex justify-between text-xs font-mono text-gray-400"><span>найдено иконок:</span> <span id="count-roles" class="text-white">0</span></div>
                </div>

                <div class="grid grid-cols-1 gap-2 mt-4">
                    <button onclick="RoleApp.loadPreview()" id="btn-preview" class="bg-white/10 text-white font-bold py-3 rounded-lg hover:bg-white/20 transition-all flex items-center justify-center gap-2" disabled>
                        <span class="material-symbols-rounded text-lg">visibility</span> ПОСМОТРЕТЬ
                    </button>
                    <button onclick="RoleApp.downloadZip()" id="btn-download" class="bg-lime text-black font-bold py-3 rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2" disabled>
                        <span class="material-symbols-rounded text-lg">archive</span> СКАЧАТЬ ZIP
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 bg-black border border-white/10 rounded-xl flex flex-col relative overflow-hidden">
            <div class="w-full bg-white/5 border-b border-white/5 px-4 py-3 text-gray-500 flex justify-between items-center z-10">
                <span>результаты</span>
                <span class="text-xs font-mono" id="preview-status">пусто</span>
            </div>
            <div id="preview-area" class="flex-1 overflow-y-auto p-4 scroll-smooth grid-preview">
                <div class="col-span-full flex flex-col items-center justify-center text-gray-600 h-full opacity-50">
                    <span class="material-symbols-rounded text-4xl mb-2">admin_panel_settings</span>
                    <span class="text-xs font-mono">ожидание выбора сервера</span>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="selected_id">

    <script>
        window.onDiscordReady = () => { RoleApp.fetchGuilds(); };

        const RoleApp = {
            token: null,
            icons: [],

            toggleDD() { document.getElementById('guild_dd').classList.toggle('hidden'); },

            selectGuild(id, name, icon) {
                document.getElementById('guild_dd').classList.add('hidden');
                document.getElementById('selected_id').value = id;
                document.getElementById('guild_disp').innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden"><img src="${icon}" class="w-5 h-5 rounded-full shrink-0"> <span class="font-bold text-xs truncate">${name}</span></div>
                    <span class="material-symbols-rounded text-sm text-lime shrink-0">check_circle</span>
                `;
                document.getElementById('guild_disp').classList.add('border-lime');
                document.getElementById('btn-preview').disabled = false;
                document.getElementById('btn-download').disabled = false;
                this.resetPreview();
            },

            resetPreview() {
                document.getElementById('preview-area').innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center text-gray-600 h-full opacity-50">
                    <span class="material-symbols-rounded text-4xl mb-2">touch_app</span>
                    <span class="text-xs font-mono">нажми "посмотреть" для поиска</span>
                </div>`;
                document.getElementById('count-roles').innerText = '0';
                this.icons = [];
            },

            async fetchGuilds() {
                this.token = localStorage.getItem('allisighs_discord_token');
                if(!this.token) return;
                const btn = document.getElementById('refresh-icon');
                btn.classList.add('animate-spin');
                try {
                    const res = await fetch('https://discord.com/api/v9/users/@me/guilds', { headers: { 'Authorization': this.token } });
                    const guilds = await res.json();
                    const dd = document.getElementById('guild_dd');
                    dd.innerHTML = '';
                    guilds.sort((a,b)=>a.name.localeCompare(b.name)).forEach(g => {
                        let icon = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` : `https://cdn.discordapp.com/embed/avatars/0.png`;
                        const item = document.createElement('div');
                        item.className = 'dd-opt text-gray-300';
                        item.innerHTML = `<img src="${icon}" class="g-icon"><div class="text-xs font-bold text-gray-200 truncate">${g.name}</div>`;
                        item.onclick = () => this.selectGuild(g.id, g.name, icon);
                        dd.appendChild(item);
                    });
                } catch(e) { console.error(e); } 
                finally { setTimeout(() => btn.classList.remove('animate-spin'), 500); }
            },

            async fetchRoles() {
                const gid = document.getElementById('selected_id').value;
                if(!gid) return false;
                try {
                    const res = await fetch(`https://discord.com/api/v9/guilds/${gid}/roles`, { headers: { 'Authorization': this.token } });
                    const roles = await res.json();
                    this.icons = roles.filter(r => r.icon);
                    document.getElementById('count-roles').innerText = this.icons.length;
                    return true;
                } catch(e) { alert('ошибка загрузки'); return false; }
            },

            async loadPreview() {
                const box = document.getElementById('preview-area');
                box.innerHTML = '<div class="col-span-full flex justify-center mt-10"><div class="w-8 h-8 border-2 border-lime border-t-transparent rounded-full animate-spin"></div></div>';
                
                const ok = await this.fetchRoles();
                if(!ok) return;

                box.innerHTML = '';
                if(this.icons.length === 0) {
                    box.innerHTML = '<div class="col-span-full text-center text-gray-500 mt-10 font-mono text-xs">иконок ролей не найдено</div>';
                    return;
                }

                this.icons.forEach(r => {
                    const url = `https://cdn.discordapp.com/role-icons/${r.id}/${r.icon}.png?size=128`;
                    box.innerHTML += `
                        <div class="preview-item">
                            <img src="${url}" class="preview-img" loading="lazy">
                            <span class="preview-name">${r.name}</span>
                        </div>`;
                });
                document.getElementById('preview-status').innerText = `показано ${this.icons.length}`;
            },

            async downloadZip() {
                if(this.icons.length === 0) await this.fetchRoles();
                if(this.icons.length === 0) return alert('нет иконок');

                const btn = document.getElementById('btn-download');
                const prevText = btn.innerHTML;
                btn.innerHTML = 'АРХИВАЦИЯ...';
                btn.classList.add('opacity-50', 'cursor-not-allowed');

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`roles_${document.getElementById('selected_id').value}`);
                    const promises = [];

                    this.icons.forEach(r => {
                        const name = r.name.replace(/[^a-z0-9а-яё]/gi, '_').substring(0, 32);
                        promises.push(
                            fetch(`https://cdn.discordapp.com/role-icons/${r.id}/${r.icon}.png?size=128`)
                                .then(res => res.blob())
                                .then(b => folder.file(`${name}_${r.id}.png`, b))
                        );
                    });

                    await Promise.all(promises);
                    const content = await zip.generateAsync({type:"blob"});
                    saveAs(content, `roles_${document.getElementById('selected_id').value}.zip`);
                } catch(e) { alert('ошибка при создании архива'); }
                
                btn.innerHTML = prevText;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        };

        window.onclick = function(e) {
            if (!e.target.closest('.group')) {
                document.getElementById('guild_dd').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
