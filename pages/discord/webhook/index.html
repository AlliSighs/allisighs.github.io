<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <!-- FAVICONS & SEO -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/siteicon.png">
    <link rel="apple-touch-icon" href="/siteicon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allisighs tools // webhook sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/main.js"></script>
    <style>
        .discord-preview { background-color: #313338; color: #dbdee1; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .discord-msg { display: flex; padding: 1rem; gap: 1rem; }
        .d-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2; flex-shrink: 0; object-fit: cover; }
        .d-header { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.25rem; }
        .d-username { font-weight: 500; color: #f2f3f5; font-size: 1rem; }
        .d-bot-tag { background-color: #5865f2; color: #fff; font-size: 0.625rem; padding: 0.09rem 0.275rem; border-radius: 0.1875rem; vertical-align: middle; line-height: 1.3; font-weight: 500; display: inline-flex; align-items: center; }
        .d-timestamp { font-size: 0.75rem; color: #949ba4; font-weight: 400; }
        .d-content { font-size: 1rem; line-height: 1.375rem; white-space: pre-wrap; word-wrap: break-word; }
        .d-embed { border-left: 4px solid #1e1f22; background-color: #2b2d31; border-radius: 4px; padding: 0.75rem; margin-top: 0.5rem; max-width: 520px; display: grid; gap: 0.5rem; }
        .d-embed-title { font-weight: 600; color: #f2f3f5; font-size: 1rem; }
        .d-embed-desc { font-size: 0.875rem; color: #dbdee1; white-space: pre-wrap; }
        .d-embed-footer { font-size: 0.75rem; color: #949ba4; display: flex; align-items: center; gap: 0.5rem; }
        .d-embed-image { max-width: 100%; border-radius: 4px; margin-top: 0.5rem; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    </style>
</head>
<body class="lowercase min-h-screen relative overflow-hidden selection:bg-lime selection:text-black font-sans antialiased bg-black">
    
    <div id="system-loader">
        <div class="w-32 h-1 bg-gray-800 rounded overflow-hidden">
            <div class="h-full bg-lime w-1/2 animate-[blob_2s_infinite]"></div>
        </div>
    </div>
    
    <header class="fixed top-0 w-full z-40 px-6 h-16 flex justify-between items-center border-b border-white/5 bg-black/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <a href="../../../" class="flex items-center gap-2 text-gray-400 hover:text-lime transition-colors">
                <span class="material-symbols-rounded text-[24px]">arrow_back</span>
                <span class="font-mono font-bold tracking-tight">назад</span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <span id="user-greeting" class="font-mono text-sm text-lime">...</span>
                <button onclick="logout()" class="text-gray-600 hover:text-white transition-colors"><span class="material-symbols-rounded text-[20px]">logout</span></button>
            </div>
        </div>
    </header>

    <div class="pt-20 px-4 h-screen flex flex-col md:flex-row gap-4 pb-4">
        
        <div class="w-full md:w-[450px] bg-dark border border-white/10 rounded-xl flex flex-col p-5 overflow-y-auto shrink-0 z-20 relative bg-black">
            <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-4">
                <div>
                    <h2 class="text-xl font-black text-white leading-none">webhook sender</h2>
                    <div class="text-xs text-lime font-mono mt-1">отправка сообщений</div>
                </div>
                <button onclick="WebhookApp.clear()" class="p-2 bg-white/5 rounded-lg hover:bg-white/10 text-gray-400 hover:text-red-500 transition-colors" title="очистить форму">
                    <span class="material-symbols-rounded text-xl">delete</span>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-lime mb-2">webhook url <span class="text-red-500">*</span></label>
                    <input type="password" id="wh-url" placeholder="https://discord.com/api/webhooks/..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none transition-all">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-mono text-gray-500 mb-2">никнейм</label>
                        <input type="text" id="wh-username" oninput="WebhookApp.update()" placeholder="Spidey Bot" class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-gray-500 mb-2">аватар (url)</label>
                        <input type="text" id="wh-avatar" oninput="WebhookApp.update()" placeholder="https://..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-mono text-gray-500 mb-2">сообщение</label>
                    <textarea id="wh-content" oninput="WebhookApp.update()" rows="3" placeholder="привет мир..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-sm focus:border-lime outline-none resize-none"></textarea>
                </div>

                <div class="border-t border-white/10 pt-4">
                    <div class="flex items-center gap-2 mb-4 cursor-pointer" onclick="WebhookApp.toggleEmbed()">
                        <div class="w-4 h-4 border border-lime rounded bg-lime/10 flex items-center justify-center">
                            <span class="material-symbols-rounded text-[14px] text-lime" id="embed-check">check</span>
                        </div>
                        <span class="text-xs font-bold text-white">EMBED ВЛОЖЕНИЕ</span>
                    </div>

                    <div id="embed-fields" class="space-y-3 pl-4 border-l border-white/10">
                        <div class="flex gap-2">
                            <input type="color" id="em-color" oninput="WebhookApp.update()" value="#5865F2" class="w-10 h-10 bg-transparent cursor-pointer rounded overflow-hidden">
                            <input type="text" id="em-title" oninput="WebhookApp.update()" placeholder="заголовок embed..." class="flex-1 bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none">
                        </div>
                        <textarea id="em-desc" oninput="WebhookApp.update()" rows="3" placeholder="описание embed..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-sm focus:border-lime outline-none resize-none"></textarea>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="em-footer" oninput="WebhookApp.update()" placeholder="футер текст" class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none">
                            <input type="text" id="em-image" oninput="WebhookApp.update()" placeholder="картинка (url)" class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono text-xs focus:border-lime outline-none">
                        </div>
                    </div>
                </div>

                <button onclick="WebhookApp.send()" id="btn-send" class="w-full bg-lime text-black font-bold py-4 rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2 mt-4">
                    <span class="material-symbols-rounded">send</span> ОТПРАВИТЬ
                </button>
            </div>
        </div>

        <div class="flex-1 bg-[#313338] border border-white/10 rounded-xl flex flex-col relative overflow-hidden">
            <div class="absolute top-4 right-4 z-10 opacity-50 pointer-events-none">
                <span class="text-[100px] text-white/5 font-black leading-none select-none">PREVIEW</span>
            </div>
            
            <div class="flex-1 p-6 overflow-y-auto flex items-end pb-10">
                <div class="discord-msg w-full max-w-4xl mx-auto group">
                    <img src="" id="prev-avatar" class="d-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                    <div class="flex-1 min-w-0">
                        <div class="d-header">
                            <span id="prev-username" class="d-username">Spidey Bot</span>
                            <span class="d-bot-tag"><span class="material-symbols-rounded text-[10px] mr-0.5">check</span>BOT</span>
                            <span class="d-timestamp">сегодня в 13:37</span>
                        </div>
                        <div id="prev-content" class="d-content text-gray-400 italic">пустое сообщение...</div>
                        
                        <div id="prev-embed" class="d-embed hidden">
                            <div class="flex justify-between items-start gap-4">
                                <div class="w-full">
                                    <div id="prev-em-title" class="d-embed-title mb-1"></div>
                                    <div id="prev-em-desc" class="d-embed-desc"></div>
                                </div>
                                <img id="prev-em-thumb" class="w-16 h-16 object-cover rounded hidden">
                            </div>
                            <img id="prev-em-image" class="d-embed-image hidden">
                            <div id="prev-em-footer" class="d-embed-footer mt-2 hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WebhookApp = {
            useEmbed: true,
            
            toggleEmbed() {
                this.useEmbed = !this.useEmbed;
                const el = document.getElementById('embed-fields');
                const check = document.getElementById('embed-check');
                
                if(this.useEmbed) {
                    el.classList.remove('opacity-50', 'pointer-events-none');
                    check.innerText = 'check';
                } else {
                    el.classList.add('opacity-50', 'pointer-events-none');
                    check.innerText = '';
                }
                this.update();
            },

            update() {
                const uname = document.getElementById('wh-username').value.trim() || 'Spidey Bot';
                const avatar = document.getElementById('wh-avatar').value.trim() || 'https://cdn.discordapp.com/embed/avatars/0.png';
                const content = document.getElementById('wh-content').value || '';
                
                document.getElementById('prev-username').innerText = uname;
                document.getElementById('prev-avatar').src = avatar;
                
                const contEl = document.getElementById('prev-content');
                if(!content) {
                    contEl.innerText = 'пустое сообщение...';
                    contEl.classList.add('text-gray-400', 'italic');
                } else {
                    contEl.innerText = content;
                    contEl.classList.remove('text-gray-400', 'italic');
                }

                const emEl = document.getElementById('prev-embed');
                if(this.useEmbed) {
                    const color = document.getElementById('em-color').value;
                    const title = document.getElementById('em-title').value;
                    const desc = document.getElementById('em-desc').value;
                    const footer = document.getElementById('em-footer').value;
                    const image = document.getElementById('em-image').value;

                    if(!title && !desc && !footer && !image) {
                        emEl.classList.add('hidden');
                    } else {
                        emEl.classList.remove('hidden');
                        emEl.style.borderLeftColor = color;
                        
                        const tEl = document.getElementById('prev-em-title');
                        tEl.innerText = title;
                        tEl.style.display = title ? 'block' : 'none';

                        const dEl = document.getElementById('prev-em-desc');
                        dEl.innerText = desc;
                        dEl.style.display = desc ? 'block' : 'none';

                        const fEl = document.getElementById('prev-em-footer');
                        fEl.innerText = footer;
                        fEl.classList.toggle('hidden', !footer);

                        const iEl = document.getElementById('prev-em-image');
                        if(image) {
                            iEl.src = image;
                            iEl.classList.remove('hidden');
                            iEl.onerror = () => iEl.classList.add('hidden');
                        } else {
                            iEl.classList.add('hidden');
                        }
                    }
                } else {
                    emEl.classList.add('hidden');
                }
            },

            clear() {
                const inputs = document.querySelectorAll('input, textarea');
                inputs.forEach(i => {
                    if(i.type !== 'color') i.value = '';
                    else i.value = '#5865F2';
                });
                this.update();
            },

            async send() {
                const url = document.getElementById('wh-url').value.trim();
                if(!url) return alert('укажи webhook url');

                const btn = document.getElementById('btn-send');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-rounded animate-spin">sync</span> ОТПРАВКА...';
                btn.disabled = true;

                const payload = {
                    username: document.getElementById('wh-username').value.trim() || undefined,
                    avatar_url: document.getElementById('wh-avatar').value.trim() || undefined,
                    content: document.getElementById('wh-content').value || undefined
                };

                if(this.useEmbed) {
                    const title = document.getElementById('em-title').value;
                    const desc = document.getElementById('em-desc').value;
                    const color = document.getElementById('em-color').value;
                    const footer = document.getElementById('em-footer').value;
                    const image = document.getElementById('em-image').value;

                    if(title || desc || footer || image) {
                        payload.embeds = [{
                            title: title || undefined,
                            description: desc || undefined,
                            color: parseInt(color.replace('#', ''), 16),
                            footer: footer ? { text: footer } : undefined,
                            image: image ? { url: image } : undefined
                        }];
                    }
                }

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if(res.ok || res.status === 204) {
                        alert('отправлено!');
                    } else {
                        const err = await res.json();
                        alert('ошибка: ' + (err.message || res.status));
                    }
                } catch(e) {
                    alert('ошибка сети: ' + e.message);
                }

                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.addEventListener('load', () => WebhookApp.update());
    </script>
</body>
</html>
