<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/siteicon.png">
    <link rel="apple-touch-icon" href="/siteicon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allisighs tools // discord soundboard downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/main.js"></script>
    <style>
        .dd-opt { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .dd-opt:hover { background: rgba(204, 255, 0, 0.1); }
        .g-icon { width: 32px; height: 32px; border-radius: 10px; background: #222; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        
        .sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 16px; }
        .sound-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .sound-card:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: rgba(204, 255, 0, 0.4); 
            transform: translateY(-2px);
        }
        .sound-card.playing {
            border-color: #ccff00;
            background: rgba(204, 255, 0, 0.05);
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.1);
        }
        .sound-icon { font-size: 32px; margin-bottom: 10px; transition: transform 0.2s; }
        .sound-card:hover .sound-icon { transform: scale(1.1); }
        .sound-name { font-size: 11px; font-weight: bold; text-align: center; color: #e5e7eb; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sound-vol { font-size: 9px; font-family: 'JetBrains Mono', monospace; color: #6b7280; margin-top: 4px; }
        
        .progress-rail { width: 100%; height: 2px; background: rgba(255,255,255,0.1); margin-top: 15px; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; background: #ccff00; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body class="lowercase min-h-screen relative overflow-hidden selection:bg-lime selection:text-black font-sans antialiased bg-black">
    
    <div id="system-loader">
        <div class="w-32 h-1 bg-gray-800 rounded overflow-hidden">
            <div class="h-full bg-lime w-1/2 animate-[blob_2s_infinite]"></div>
        </div>
    </div>

    <div id="discord-auth-overlay" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-dark border border-white/10 p-8 rounded-2xl shadow-2xl relative">
            <h2 class="text-2xl font-black text-white mb-2 text-center">discord authorization</h2>
            <p class="text-gray-500 font-mono text-xs mb-6 text-center">введи токен для доступа к звукам.</p>
            <input type="password" id="discord-token-input" placeholder="OTk..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white font-mono mb-4 focus:border-lime outline-none text-center transition-all">
            <button id="discord-auth-btn" onclick="submitDiscordToken()" class="w-full bg-lime text-black font-bold py-3 rounded-lg hover:bg-white transition-colors">войти</button>
        </div>
    </div>

    <header class="fixed top-0 w-full z-40 px-6 h-16 flex justify-between items-center border-b border-white/5 bg-black/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <a href="../../../" class="flex items-center gap-2 text-gray-400 hover:text-lime transition-colors">
                <span class="material-symbols-rounded text-[24px]">arrow_back</span>
                <span class="font-mono font-bold tracking-tight">назад</span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div id="discord-profile"></div>
            <div class="w-px h-6 bg-white/10"></div>
            <div class="flex items-center gap-3">
                <span id="user-greeting" class="font-mono text-sm text-lime">...</span>
                <button onclick="logout()" class="text-gray-600 hover:text-white transition-colors"><span class="material-symbols-rounded text-[20px]">logout</span></button>
            </div>
        </div>
    </header>

    <div class="pt-20 px-4 h-screen flex flex-col md:flex-row gap-4 pb-4">
        <div class="w-full md:w-[380px] bg-dark border border-white/10 rounded-xl flex flex-col p-5 shrink-0 z-20 relative bg-black h-fit">
            <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-4">
                <div>
                    <h2 class="text-xl font-black text-white leading-none">soundboard dump</h2>
                    <div class="text-xs text-lime font-mono mt-1" id="scan-status">готов к работе</div>
                </div>
                <button onclick="SoundApp.fetchGuilds()" class="p-2 bg-white/5 rounded-lg hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
                    <span class="material-symbols-rounded text-xl" id="refresh-icon">sync</span>
                </button>
            </div>

            <div class="space-y-4">
                <div class="relative group">
                    <label class="block text-xs font-mono text-gray-500 mb-2">выбери сервер</label>
                    <div onclick="SoundApp.toggleDD()" class="bg-black border border-white/20 p-3 rounded-lg text-white cursor-pointer flex justify-between items-center hover:border-lime transition-colors" id="guild_disp">
                        <span class="italic text-gray-600 text-xs">загрузка списка...</span>
                        <span class="material-symbols-rounded text-sm">arrow_drop_down</span>
                    </div>
                    <div id="guild_dd" class="absolute top-full left-0 w-full bg-dark border border-white/20 rounded-lg mt-1 max-h-60 overflow-y-auto hidden z-50 shadow-2xl"></div>
                </div>

                <div class="p-4 bg-white/5 rounded-lg border border-white/5">
                    <div class="flex justify-between text-xs font-mono text-gray-400 mb-1"><span>НАЙДЕНО:</span> <span id="count-sounds" class="text-white">0</span></div>
                    <div class="flex justify-between text-xs font-mono text-gray-400"><span>СЕРВЕР:</span> <span id="current-server-name" class="text-white truncate max-w-[150px] text-right">---</span></div>
                </div>

                <button onclick="SoundApp.downloadZip()" id="btn-download" class="w-full bg-lime text-black font-bold py-3 rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2 mt-4" disabled>
                    <span class="material-symbols-rounded text-lg">archive</span> СКАЧАТЬ ZIP
                </button>
                
                <div class="text-[10px] text-gray-600 font-mono text-center mt-2">
                    *нажми на карточку для прослушивания
                </div>
            </div>
        </div>

        <div class="flex-1 bg-black border border-white/10 rounded-xl flex flex-col relative overflow-hidden">
            <div class="w-full bg-white/5 border-b border-white/5 px-4 py-3 text-gray-500 flex justify-between items-center z-10">
                <span>SOUND LIBRARY</span>
                <div class="flex items-center gap-2">
                    <span id="player-status" class="text-xs font-mono text-lime opacity-0 transition-opacity">PLAYING...</span>
                    <span class="material-symbols-rounded text-lg text-gray-600">graphic_eq</span>
                </div>
            </div>
            
            <div id="sound-area" class="flex-1 overflow-y-auto scroll-smooth sound-grid relative">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 opacity-50 pointer-events-none">
                    <span class="material-symbols-rounded text-6xl mb-4">music_note</span>
                    <span class="font-mono text-xs">выбери сервер из списка</span>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="selected_id">

    <script>
        window.onDiscordReady = () => { SoundApp.fetchGuilds(); };

        const SoundApp = {
            token: null,
            currentSounds: [],
            audio: new Audio(),

            toggleDD() {
                document.getElementById('guild_dd').classList.toggle('hidden');
            },

            async fetchGuilds() {
                this.token = localStorage.getItem('allisighs_discord_token');
                if(!this.token) return;

                const btn = document.getElementById('refresh-icon');
                btn.classList.add('animate-spin');
                
                try {
                    const res = await fetch('https://discord.com/api/v9/users/@me/guilds', { headers: { 'Authorization': this.token } });
                    const guilds = await res.json();
                    
                    const dd = document.getElementById('guild_dd');
                    dd.innerHTML = '';
                    
                    guilds.sort((a,b)=>a.name.localeCompare(b.name)).forEach(g => {
                        let icon = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` : `https://cdn.discordapp.com/embed/avatars/0.png`;
                        const item = document.createElement('div');
                        item.className = 'dd-opt text-gray-300';
                        item.innerHTML = `<img src="${icon}" class="g-icon"><div class="text-xs font-bold text-gray-200 truncate">${g.name}</div>`;
                        item.onclick = () => this.selectGuild(g.id, g.name, icon);
                        dd.appendChild(item);
                    });

                    document.getElementById('guild_disp').innerHTML = `<span class="italic text-white text-xs">выбери сервер (${guilds.length})</span><span class="material-symbols-rounded text-sm">arrow_drop_down</span>`;

                } catch(e) { 
                    console.error(e);
                    document.getElementById('guild_disp').innerHTML = `<span class="italic text-red-500 text-xs">ошибка api</span>`;
                } finally {
                    btn.classList.remove('animate-spin');
                }
            },

            async selectGuild(id, name, icon) {
                document.getElementById('guild_dd').classList.add('hidden');
                document.getElementById('selected_id').value = id;
                
                document.getElementById('guild_disp').innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden"><img src="${icon}" class="w-5 h-5 rounded-md shrink-0"> <span class="font-bold text-xs truncate">${name}</span></div>
                    <span class="material-symbols-rounded text-sm text-lime shrink-0">check_circle</span>
                `;
                document.getElementById('guild_disp').classList.add('border-lime');
                document.getElementById('current-server-name').innerText = name;
                
                await this.fetchSounds(id);
            },

            async fetchSounds(gid) {
                const box = document.getElementById('sound-area');
                box.innerHTML = '<div class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 opacity-50"><span class="material-symbols-rounded text-6xl mb-4 animate-spin">sync</span><span class="font-mono text-xs">загрузка звуков...</span></div>';
                
                try {
                    const res = await fetch(`https://discord.com/api/v9/guilds/${gid}/soundboard-sounds`, { headers: { 'Authorization': this.token } });
                    
                    if(!res.ok) throw new Error('error');
                    
                    const data = await res.json();
                    const sounds = data.items || [];
                    
                    this.currentSounds = sounds;
                    
                    document.getElementById('count-sounds').innerText = sounds.length;
                    
                    if(sounds.length === 0) {
                        box.innerHTML = '<div class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 opacity-50"><span class="material-symbols-rounded text-6xl mb-4">music_off</span><span class="font-mono text-xs">звуков нет</span></div>';
                        document.getElementById('btn-download').disabled = true;
                    } else {
                        document.getElementById('btn-download').disabled = false;
                        this.renderSounds();
                    }

                } catch(e) {
                    console.log(e);
                    box.innerHTML = '<div class="absolute inset-0 flex flex-col items-center justify-center text-red-500 opacity-50"><span class="material-symbols-rounded text-6xl mb-4">error</span><span class="font-mono text-xs">ошибка доступа</span></div>';
                    document.getElementById('count-sounds').innerText = '0';
                    document.getElementById('btn-download').disabled = true;
                }
            },

            renderSounds() {
                const box = document.getElementById('sound-area');
                box.innerHTML = '';
                
                this.currentSounds.forEach(s => {
                    const el = document.createElement('div');
                    el.className = 'sound-card group';
                    
                    let emojiHtml = '<span class="material-symbols-rounded sound-icon text-gray-500">graphic_eq</span>';
                    if(s.emoji_id) {
                        emojiHtml = `<img src="https://cdn.discordapp.com/emojis/${s.emoji_id}.png" class="w-8 h-8 mb-2 object-contain transition-transform group-hover:scale-110">`;
                    } else if(s.emoji_name) {
                        emojiHtml = `<span class="text-2xl mb-2 transition-transform group-hover:scale-110">${s.emoji_name}</span>`;
                    }

                    el.innerHTML = `
                        ${emojiHtml}
                        <div class="sound-name" title="${s.name}">${s.name}</div>
                        <div class="sound-vol">VOL: ${Math.round(s.volume * 100)}%</div>
                        <div class="progress-rail"><div class="progress-bar"></div></div>
                    `;
                    
                    el.onclick = () => this.playSound(s.sound_id, el);
                    box.appendChild(el);
                });
            },

            playSound(id, el) {
                document.querySelectorAll('.sound-card').forEach(c => {
                    c.classList.remove('playing');
                    c.querySelector('.progress-bar').style.width = '0%';
                });

                const url = `https://cdn.discordapp.com/soundboard-sounds/${id}`;
                this.audio.src = url;
                this.audio.volume = 0.5;
                
                el.classList.add('playing');
                const bar = el.querySelector('.progress-bar');
                const status = document.getElementById('player-status');
                
                status.style.opacity = '1';
                this.audio.play().catch(e => {
                    alert('ошибка воспроизведения: ' + e.message);
                    el.classList.remove('playing');
                });
                
                this.audio.ontimeupdate = () => {
                    if(this.audio.duration) {
                        const pct = (this.audio.currentTime / this.audio.duration) * 100;
                        bar.style.width = `${pct}%`;
                    }
                };
                
                this.audio.onended = () => {
                    el.classList.remove('playing');
                    bar.style.width = '0%';
                    status.style.opacity = '0';
                };
            },

            async downloadZip() {
                if(this.currentSounds.length === 0) return;
                
                const btn = document.getElementById('btn-download');
                const prev = btn.innerHTML;
                btn.innerHTML = 'СКАЧИВАНИЕ...';
                btn.disabled = true;
                btn.classList.add('opacity-50');

                try {
                    const zip = new JSZip();
                    const folder = zip.folder(`sounds_${document.getElementById('selected_id').value}`);
                    const promises = [];

                    for(const s of this.currentSounds) {
                        const url = `https://cdn.discordapp.com/soundboard-sounds/${s.sound_id}`;
                        const safeName = s.name.replace(/[^a-z0-9а-яё]/gi, '_').substring(0, 50);
                        
                        promises.push(
                            window.downloadCdnFile(url)
                                .then(b => { 
                                    folder.file(`${safeName}.mp3`, b); 
                                })
                                .catch(err => console.error(`skip ${s.name}:`, err))
                        );
                    }

                    await Promise.all(promises);
                    const content = await zip.generateAsync({type:"blob"});
                    saveAs(content, `sounds_${document.getElementById('selected_id').value}.zip`);
                } catch(e) { 
                    alert('ошибка при архивации: ' + e.message); 
                }

                btn.innerHTML = prev;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        };

        window.onclick = function(e) {
            if (!e.target.closest('.group')) {
                document.getElementById('guild_dd').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
