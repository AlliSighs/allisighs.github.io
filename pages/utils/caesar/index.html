<body class="lowercase min-h-screen relative overflow-x-hidden selection:bg-lime selection:text-black font-sans antialiased">
        <!-- LOADER -->
    <div id="system-loader">
        <div class="w-32 h-1 bg-gray-800 rounded overflow-hidden">
            <div class="h-full bg-lime w-1/2 animate-[blob_2s_infinite]"></div>
        </div>
    </div>
    
    <header class="fixed top-0 w-full z-40 px-6 h-16 flex justify-between items-center border-b border-white/5 bg-black/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <a href="../../../" class="flex items-center gap-2 hover:text-lime transition-colors">
                <span class="material-symbols-rounded text-lime text-[24px]">arrow_back</span>
                <span class="font-mono font-bold tracking-tight">назад</span>
            </a>
        </div>
        <div class="font-mono text-gray-500 text-xs lowercase">utils / caesar</div>
        <div class="flex items-center gap-3">
            <span id="user-greeting" class="font-mono text-sm text-lime">...</span>
            <button onclick="logout()" class="text-gray-600 hover:text-white transition-colors"><span class="material-symbols-rounded text-[20px]">logout</span></button>
        </div>
    </header>

    <div class="pt-24 px-6 md:px-12 max-w-4xl mx-auto pb-12"><div class="bg-dark border border-white/10 p-8 rounded-2xl">
    <h1 class="text-3xl font-black mb-6 lowercase">шифр цезаря</h1>
    <textarea id="caesar-text" rows="4" placeholder="введи текст..." class="w-full bg-black border border-white/20 p-3 rounded-lg text-white focus:outline-none focus:border-lime font-mono mb-4"></textarea>
    <input type="number" id="caesar-shift" value="3" class="w-full bg-black border border-white/20 p-3 rounded-lg text-white mb-4" placeholder="сдвиг">
    <div class="grid grid-cols-2 gap-4 mb-4">
        <button onclick="caesarCipher('encrypt')" class="bg-lime text-black font-bold py-3 rounded-lg lowercase">зашифровать</button>
        <button onclick="caesarCipher('decrypt')" class="bg-white/10 text-white font-bold py-3 rounded-lg lowercase">расшифровать</button>
    </div>
    <div id="caesar-output" class="hidden">
        <div class="bg-black border border-lime/30 p-4 rounded-lg font-mono text-sm text-lime" translate="no" class="notranslate" id="caesar-result"></div>
        <button onclick="copyToClipboard('caesar-result')" class="mt-2 w-full bg-white/10 hover:bg-white/20 text-white py-2 rounded-lg text-sm lowercase">скопировать</button>
    </div>
</div>    </div>
</body>
</html><script>function caesarCipher(mode) {
    const text = document.getElementById('caesar-text').value;
    const shift = parseInt(document.getElementById('caesar-shift').value);
    if (!text) { alert('введи текст!'); return; }
    const actualShift = mode === 'decrypt' ? -shift : shift;
    let result = '';
    for (let char of text) {
        if (char.match(/[a-z]/i)) {
            const code = char.charCodeAt(0);
            const isUpperCase = code >= 65 && code <= 90;
            const base = isUpperCase ? 65 : 97;
            result += String.fromCharCode(((code - base + actualShift + 26) % 26) + base);
        } else if (char.match(/[а-яё]/i)) {
            const code = char.charCodeAt(0);
            const isUpperCase = code >= 1040 && code <= 1071;
            const base = isUpperCase ? 1040 : 1072;
            result += String.fromCharCode(((code - base + actualShift + 32) % 32) + base);
        } else { result += char; }
    }
    document.getElementById('caesar-result').textContent = result;
    document.getElementById('caesar-output').classList.remove('hidden');
}</script>
