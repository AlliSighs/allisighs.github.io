<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#cv2d{display:block;position:fixed;top:0;left:0;cursor:none}
#cv3d{display:none;position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}

#backbtn:hover{background:rgba(255,255,255,.42)}
#winpulse{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style>
</head>
<body>
<canvas id="cv2d"></canvas>

<script>

const cv2d=document.getElementById('cv2d');
const g=cv2d.getContext('2d');
let W=0,H=0,FLOOR=0;
const R=s=>(Math.random()-.5)*s;
const rn=(a,b)=>a+Math.random()*(b-a);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let frameT=0;
let worldActive=false;
let world3=null;


function pen(col,lw){g.strokeStyle=col||'#222';g.lineWidth=(lw||1.8)+Math.random()*.25;g.lineCap='round';g.lineJoin='round';}
function wl(x1,y1,x2,y2,r){r=r||2;const dx=x2-x1,dy=y2-y1,d=Math.sqrt(dx*dx+dy*dy),n=Math.max(2,~~(d/11));g.beginPath();g.moveTo(x1+R(r*.4),y1+R(r*.4));for(let i=1;i<n;i++){const t=i/n;g.lineTo(x1+dx*t+R(r),y1+dy*t+R(r));}g.lineTo(x2+R(r*.4),y2+R(r*.4));g.stroke();}
function wc(x,y,r,rough,segs){rough=rough||2;segs=segs||28;g.beginPath();for(let i=0;i<=segs;i++){const a=i/segs*Math.PI*2,rr=r+R(rough);i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.stroke();}
function we(x,y,rx,ry,rot,rough,segs){rot=rot||0;rough=rough||2;segs=segs||26;g.save();g.translate(x,y);g.rotate(rot);g.beginPath();for(let i=0;i<=segs;i++){const a=i/segs*Math.PI*2;i?g.lineTo(Math.cos(a)*(rx+R(rough)),Math.sin(a)*(ry+R(rough))):g.moveTo(Math.cos(a)*(rx+R(rough)),Math.sin(a)*(ry+R(rough)));}g.closePath();g.stroke();g.restore();}
function wr(x,y,w,h,r){r=r||2;const o=r*1.5;wl(x-o,y+R(r*.4),x+w+o,y+R(r*.4),r);wl(x+w+R(r*.4),y-o,x+w+R(r*.4),y+h+o,r);wl(x+w+o,y+h+R(r*.4),x-o,y+h+R(r*.4),r);wl(x+R(r*.4),y+h+o,x+R(r*.4),y-o,r);}
function hatch(sp,ang,al,col){g.save();g.globalAlpha=al||.12;g.strokeStyle=col||'#888';g.lineWidth=.6;g.lineCap='butt';g.save();g.rotate(ang||0);const L=3000;for(let d=-L;d<L;d+=sp){g.beginPath();g.moveTo(d,-L);g.lineTo(d,L);g.stroke();}g.restore();g.restore();}
function dsc(y){return cl(.65+(y-FLOOR*.3)/(H-FLOOR*.3)*.5,.5,1.3);}
function shad(x,y,rx,ry){g.save();g.globalAlpha=.07;g.fillStyle='#000';g.beginPath();g.ellipse(x,y+4,rx,ry,0,0,Math.PI*2);g.fill();g.restore();}


const PARTS=[];
function burst(x,y,col,n,pw){for(let i=0;i<(n||12);i++){const a=Math.random()*Math.PI*2,sp=rn(.5,1)*(pw||4);PARTS.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,a:1,r:rn(2,6),col:col||'#555',dec:rn(.02,.045)});}}
function rings_draw(){} 
const RINGS=[];
function ring(x,y,col){RINGS.push({x,y,r:0,a:.7,col:col||'#555'});}


let roomBG=null,winRect={x:0,y:0,w:0,h:0};
let winPulse=0;

function makeRoom(){
  if(!W||!H)return;
  FLOOR=H*.42;
  const bc=document.createElement('canvas');bc.width=W;bc.height=H;
  const c=bc.getContext('2d');
  const vy=FLOOR;
  
  c.fillStyle='#faf8f4';c.fillRect(0,0,W,vy);
  for(let i=0;i<2800;i++){c.fillStyle=`rgba(55,42,25,${Math.random()*.02})`;c.fillRect(Math.random()*W,Math.random()*vy,1,1);}
  
  c.save();c.beginPath();c.moveTo(0,vy);c.lineTo(W,vy);c.lineTo(W,H);c.lineTo(0,H);c.closePath();
  const fg=c.createLinearGradient(0,vy,0,H);fg.addColorStop(0,'#e0dbd0');fg.addColorStop(1,'#cdc8bb');
  c.fillStyle=fg;c.fill();
  for(let i=0;i<5500;i++){c.fillStyle=`rgba(68,48,24,${Math.random()*.04})`;c.fillRect(Math.random()*W,vy+Math.random()*(H-vy),1,1);}
  c.restore();
  
  c.strokeStyle='rgba(90,68,40,.11)';c.lineWidth=.9;
  for(let j=1;j<=15;j++){const fy2=vy+(H-vy)*(j/16);c.beginPath();c.moveTo(0,fy2);c.lineTo(W,fy2);c.stroke();}
  c.strokeStyle='rgba(90,68,40,.05)';c.lineWidth=.7;
  for(let i=1;i<=22;i++){const fx=i/23*W;c.beginPath();c.moveTo(fx,vy);c.lineTo(fx,H);c.stroke();}
  
  c.strokeStyle='rgba(80,60,38,.38)';c.lineWidth=2;c.beginPath();c.moveTo(0,vy);c.lineTo(W,vy);c.stroke();
  
  const wx=W*.52,wy=H*.03,ww=W*.22,wh=vy*.87;
  winRect={x:wx,y:wy,w:ww,h:wh};
  
  c.save();c.globalAlpha=.06;
  const lc=c.createLinearGradient(wx+ww*.5,vy,wx+ww*.5,H*.78);
  lc.addColorStop(0,'#ffe89a');lc.addColorStop(1,'rgba(255,232,154,0)');
  c.fillStyle=lc;
  c.beginPath();c.moveTo(wx+10,vy);c.lineTo(wx+ww-10,vy);c.lineTo(wx+ww+95,H*.78);c.lineTo(wx-95,H*.78);c.closePath();c.fill();c.restore();
  
  c.fillStyle='#c8e8f8';c.fillRect(wx+2,wy+2,ww*.5-2,wh*.5-1);
  c.fillStyle='#bce4f6';c.fillRect(wx+ww*.5,wy+2,ww*.5-2,wh*.5-1);
  c.fillStyle='#b5dff4';c.fillRect(wx+2,wy+wh*.5,ww-4,wh*.5-2);
  
  c.save();c.globalAlpha=.28;c.fillStyle='#5a9a48';
  c.beginPath();c.ellipse(wx+ww*.2,wy+wh*.7,ww*.12,wh*.22,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(wx+ww*.75,wy+wh*.65,ww*.1,wh*.25,0,0,Math.PI*2);c.fill();
  c.restore();
  
  c.strokeStyle='rgba(62,48,34,.6)';c.lineWidth=2.5;c.strokeRect(wx,wy,ww,wh);
  c.lineWidth=1.8;
  c.beginPath();c.moveTo(wx,wy+wh*.5);c.lineTo(wx+ww,wy+wh*.5);c.stroke();
  c.beginPath();c.moveTo(wx+ww*.5,wy);c.lineTo(wx+ww*.5,wy+wh);c.stroke();
  
  c.strokeStyle='rgba(125,110,90,.35)';c.lineWidth=1.5;
  for(let s=-1;s<=1;s+=2){const base=s<0?wx:wx+ww;for(let i=0;i<9;i++){const cx2=base+s*(26-i*6);c.beginPath();c.moveTo(cx2,wy-15);c.bezierCurveTo(cx2+s*11,wy+wh*.22,cx2-s*5,wy+wh*.56,cx2+s*8,wy+wh+22);c.stroke();}}
  
  for(let i=0;i<7000;i++){c.fillStyle=`rgba(38,28,16,${Math.random()*.016})`;c.fillRect(Math.random()*W,Math.random()*H,1,1);}
  roomBG=bc;
}


class Cat{
  constructor(x,y){this.x=x;this.y=y;this.s=88;this.tailT=0;this.br=0;this.blinkN=0;this.blinkTmr=rn(100,230);this.pet=0;this.joy=0;this.idleT=0;this.vx=0;this.vy=0;this.drag=false;this.stretch=0;this.vstretch=0;this.purrs=[];this.zees=[];this.hitR=72;}
  hit(mx,my){const sc=dsc(this.y);return Math.sqrt((mx-this.x)**2+(my-this.y)**2)<this.hitR*sc;}
  update(mx,my,spd){
    this.tailT+=.034;this.br+=.021;
    this.blinkTmr--;if(this.blinkTmr<0){this.blinkN=10;this.blinkTmr=rn(80,280);}
    if(this.blinkN>0)this.blinkN--;
    const sc=dsc(this.y);
    const near=Math.sqrt((mx-this.x)**2+(my-this.y)**2)<90*sc&&spd<6;
    this.pet=near?Math.min(1,this.pet+.016):Math.max(0,this.pet-.01);
    this.joy+=(this.pet-this.joy)*.04;
    if(!near)this.idleT++;else this.idleT=0;
    this._sl=this.idleT>500?cl((this.idleT-500)/260,0,1):0;
    this.vstretch-=this.stretch*.14;this.vstretch*=.72;this.stretch+=this.vstretch;
    if(!this.drag){this.vx*=.88;this.vy*=.88;this.x+=this.vx;this.y+=this.vy;}
    this.x=cl(this.x,55,W-55);this.y=cl(this.y,FLOOR+40,H-50);
    const pp=this.joy>.45&&Math.random()<.06;
    if(pp){const sc2=dsc(this.y);this.purrs.push({x:this.x+R(16),y:this.y-this.s*.6*sc2,vy:-(0.5+Math.random()*.4),alpha:1,r:rn(4,9)*sc2*.8});}
    this.purrs.forEach(p=>{p.y+=p.vy;p.x+=R(.4);p.alpha-=.018;});this.purrs=this.purrs.filter(p=>p.alpha>0);
    if(this._sl>.25&&Math.random()<.011){const sc2=dsc(this.y);this.zees.push({x:this.x+R(10)-22*sc2,y:this.y-this.s*.7*sc2,vy:-.38,alpha:1,sz:rn(.5,1)});}
    this.zees.forEach(z=>{z.y+=z.vy;z.x+=.28;z.alpha-=.011;});this.zees=this.zees.filter(z=>z.alpha>0);
  }
  draw(){
    const sc=dsc(this.y);const s=this.s*sc*(1+Math.abs(this.stretch)*.06);
    const sl=this._sl||0;const{x,y,tailT,br,blinkN,joy}=this;
    const bs=1+Math.sin(br)*(sl>.5?.006:.02);
    shad(x,y+s*.74,s*.55,s*.12);
    g.save();g.translate(x,y);
    
    g.save();pen('#373737',2.2*sc);g.beginPath();g.moveTo(s*.34,s*.52);g.bezierCurveTo(s*.84+R(3),s*.36+R(4),s*.5+Math.cos(tailT)*s*.44,s*.03+Math.sin(tailT)*s*.38,s*.34+Math.cos(tailT)*s*.27,-.12+Math.sin(tailT)*s*.25);g.stroke();g.restore();
    
    g.save();g.beginPath();g.ellipse(0,s*.28,s*.52*bs,s*.46*bs,0,0,Math.PI*2);g.clip();g.fillStyle='#cccccc';g.fill();hatch(7,Math.PI/5,.19,'#888');g.restore();
    pen('#373737',2*sc);we(0,s*.28,s*.52*bs,s*.46*bs,0,2*sc,28);
    
    const headTilt=this.pet*.08;g.save();g.translate(0,-s*.38+s*.1*sl);g.rotate(headTilt);
    g.save();g.beginPath();g.ellipse(0,0,s*.39*bs,s*.37*bs,0,0,Math.PI*2);g.clip();g.fillStyle='#cccccc';g.fill();hatch(7,Math.PI/5,.17,'#888');g.restore();
    pen('#373737',2*sc);we(0,0,s*.39*bs,s*.37*bs,0,2*sc,26);
    pen('#373737',1.8*sc);wl(-s*.27,-s*.28,-s*.46,-s*.56+R(3),2);wl(-s*.46,-s*.56+R(3),-s*.13,-s*.31,2);wl(s*.27,-s*.28,s*.46,-s*.56+R(3),2);wl(s*.46,-s*.56+R(3),s*.13,-s*.31,2);
    g.save();g.globalAlpha=.38;pen('#f4a0b0',1.1*sc);wl(-s*.27,-s*.3,-s*.36,-s*.46,1);wl(-s*.36,-s*.46,-s*.16,-s*.33,1);wl(s*.27,-s*.3,s*.36,-s*.46,1);wl(s*.36,-s*.46,s*.16,-s*.33,1);g.restore();
    
    if(sl>.6||blinkN>4||joy>.72){pen('#373737',1.8*sc);g.beginPath();g.arc(-s*.14,-s*.04,s*.09,Math.PI,0);g.stroke();g.beginPath();g.arc(s*.14,-s*.04,s*.09,Math.PI,0);g.stroke();}
    else{pen('#373737',1.5*sc);we(-s*.14,-s*.04,s*.088,s*.094,0,1.5*sc,14);we(s*.14,-s*.04,s*.088,s*.094,0,1.5*sc,14);g.fillStyle='#1a1a1a';g.beginPath();g.ellipse(-s*.14,-s*.04,s*.04*(1+joy*.3),s*.056,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(s*.14,-s*.04,s*.04*(1+joy*.3),s*.056,0,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.globalAlpha=.75;g.beginPath();g.arc(-s*.12,-s*.06,s*.014,0,Math.PI*2);g.fill();g.beginPath();g.arc(s*.16,-s*.06,s*.014,0,Math.PI*2);g.fill();g.globalAlpha=1;}
    g.fillStyle='#f4a0b0';g.beginPath();g.moveTo(0,s*.06);g.lineTo(-s*.042,s*.1);g.lineTo(s*.042,s*.1);g.closePath();g.fill();
    pen('#666',1.2*sc);g.beginPath();g.moveTo(-s*.06,s*.12);g.quadraticCurveTo(-s*.11,s*.16+joy*s*.07,-s*.18,s*.19+joy*s*.04);g.stroke();g.beginPath();g.moveTo(s*.06,s*.12);g.quadraticCurveTo(s*.11,s*.16+joy*s*.07,s*.18,s*.19+joy*s*.04);g.stroke();
    g.save();g.globalAlpha=.55;pen('#aaa',.9*sc);[-1,1].forEach(sg=>{wl(sg*s*.05,s*.08,sg*s*.46+R(3),s*.04+R(2),1.5);wl(sg*s*.05,s*.13,sg*s*.44+R(3),s*.13+R(2),1.5);});g.restore();
    if(joy>.28){g.save();g.globalAlpha=(joy-.28)*.75;g.fillStyle='#ff9ab0';g.beginPath();g.ellipse(-s*.22,s*.06,s*.1,s*.055,.3,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(s*.22,s*.06,s*.1,s*.055,-.3,0,Math.PI*2);g.fill();g.restore();}
    if(joy>.55){g.save();g.globalAlpha=(joy-.55)*2;pen('#f5c842',1.4*sc);[[-s*.66,-s*.42],[s*.66,-s*.42],[-s*.9,.05],[s*.9,.05]].forEach(([qx,qy])=>{wl(qx-6,qy,qx+6,qy,1);wl(qx,qy-6,qx,qy+6,1);wl(qx-4,qy-4,qx+4,qy+4,1);});g.restore();}
    
    if(joy>.6){const kp=Math.sin(this.tailT*2)*5*joy;g.save();g.globalAlpha=joy*.45;pen('#aaa',1.4*sc);we(-s*.22+kp,s*.65,s*.12,s*.08,.1,1.5*sc,12);we(s*.22-kp,s*.65,s*.12,s*.08,-.1,1.5*sc,12);g.restore();}
    g.restore();g.restore();
    this.purrs.forEach(p=>{g.save();g.globalAlpha=p.alpha*.5;pen('#bbb',.9);wc(p.x,p.y,p.r,1.2,10);g.restore();});
    this.zees.forEach(z=>{g.save();g.globalAlpha=z.alpha*.7;g.fillStyle='#999';g.font=`${~~(14*z.sz)}px Georgia`;g.fillText('z',z.x,z.y);g.restore();});
  }
  onClick(){this.vstretch=.6;this.tailT+=Math.PI*.5;this.idleT=0;burst(this.x,this.y-50*dsc(this.y),'#f4a0b0',10,3);ring(this.x,this.y,'#f4a0b0');}
  onDragStart(){this.drag=true;this.idleT=0;}onDrag(dx,dy){this.x+=dx;this.y+=dy;this.vx=dx;this.vy=dy;}onDragEnd(){this.drag=false;}
}


class Blanket{
  constructor(x,y){this.x=x;this.y=y;this.GX=10;this.GY=7;this.CW=225;this.CH=150;this.pts=[];this._init();this.drag=false;}
  _init(){this.pts=[];for(let j=0;j<=this.GY;j++)for(let i=0;i<=this.GX;i++){const e=i===0||i===this.GX||j===0||j===this.GY;this.pts.push({bx:this.x+i*(this.CW/this.GX)+(e?R(11):0),by:this.y+j*(this.CH/this.GY)+(j===0?R(9):0),z:0,pz:0});}}
  pt(i,j){return this.pts[j*(this.GX+1)+i];}
  update(){this.pts.forEach(p=>{const vz=p.z-p.pz;p.pz=p.z;p.z+=vz*.958-p.z*.024;});this.pt(0,0).z=0;this.pt(this.GX,0).z=0;this.pt(0,this.GY).z=0;this.pt(this.GX,this.GY).z=0;}
  ripple(mx,my){this.pts.forEach(p=>{const d=Math.sqrt((mx-p.bx)**2+(my-p.by)**2);if(d<110)p.z+=(110-d)*.17;});}
  hit(mx,my){return mx>this.x-14&&mx<this.x+this.CW+14&&my>this.y-14&&my<this.y+this.CH+14;}
  onClick(mx,my){this.ripple(mx,my);burst(mx,my,'#c07010',8,1.5);ring(mx,my,'#d48018');}
  onDrag(dx,dy){this.x+=dx;this.y+=dy;this.pts.forEach(p=>{p.bx+=dx;p.by+=dy;});}
  draw(){
    const{GX,GY}=this,s=this;
    g.save();g.beginPath();for(let i=0;i<=GX;i++){const p=s.pt(i,0);i?g.lineTo(p.bx,p.by+p.z):g.moveTo(p.bx,p.by+p.z);}for(let j=1;j<=GY;j++){const p=s.pt(GX,j);g.lineTo(p.bx,p.by+p.z);}for(let i=GX-1;i>=0;i--){const p=s.pt(i,GY);g.lineTo(p.bx,p.by+p.z);}for(let j=GY-1;j>=0;j--){const p=s.pt(0,j);g.lineTo(p.bx,p.by+p.z);}g.closePath();g.fillStyle='#d97c14';g.globalAlpha=.95;g.fill();g.clip();hatch(12,Math.PI*.18,.14,'#ae5e08');g.restore();
    pen('#a85c0a',1.4);g.globalAlpha=.72;for(let i=0;i<=GX;i++){g.beginPath();for(let j=0;j<=GY;j++){const p=s.pt(i,j);j?g.lineTo(p.bx+R(1),p.by+p.z+R(1)):g.moveTo(p.bx+R(1),p.by+p.z+R(1));}g.stroke();}for(let j=0;j<=GY;j++){g.beginPath();for(let i=0;i<=GX;i++){const p=s.pt(i,j);i?g.lineTo(p.bx+R(1),p.by+p.z+R(1)):g.moveTo(p.bx+R(1),p.by+p.z+R(1));}g.stroke();}g.globalAlpha=1;
  }
}


class Pillow{
  constructor(x,y){this.x=x;this.y=y;this.sq=0;this.vsq=0;this.hitR=66;this.drag=false;}
  hit(mx,my){const sc=dsc(this.y);return Math.sqrt((mx-this.x)**2+(my-this.y)**2)<this.hitR*sc;}
  update(){this.vsq-=this.sq*.15;this.vsq*=.72;this.sq+=this.vsq;}
  draw(){
    const sc=dsc(this.y);const rx=66*sc*(1+this.sq*.13),ry=44*sc*(1-this.sq*.09);const{x,y}=this;
    g.save();g.globalAlpha=.07;g.fillStyle='#000';g.beginPath();g.ellipse(x,y+ry+4,rx*.85,ry*.22,0,0,Math.PI*2);g.fill();g.restore();
    g.save();g.translate(x,y);g.save();g.beginPath();for(let i=0;i<=32;i++){const a=i/32*Math.PI*2;i?g.lineTo(Math.cos(a)*(rx+R(3*sc)),Math.sin(a)*(ry+R(3*sc))):g.moveTo(Math.cos(a)*(rx+R(3*sc)),Math.sin(a)*(ry+R(3*sc)));}g.closePath();g.clip();g.fillStyle='#edece8';g.fill();hatch(11,Math.PI*.18,.09,'#aaa');g.restore();
    pen('#2e2e2e',1.8*sc);we(0,0,rx,ry,0,3*sc,34);
    g.save();g.globalAlpha=.22;pen('#999',1.1*sc);we(0,0,rx*.74,ry*.68,0,2.5*sc,28);g.restore();
    g.save();g.globalAlpha=.44;pen('#888',1.1*sc);we(0,-ry*.08,13*sc,13*sc,0,1.5*sc,18);wl(-7*sc,-ry*.35,-13*sc,-ry*.6,1.2);wl(-13*sc,-ry*.6,-3*sc,-ry*.38,1.2);wl(7*sc,-ry*.35,13*sc,-ry*.6,1.2);wl(13*sc,-ry*.6,3*sc,-ry*.38,1.2);wc(-5*sc,-ry*.12,2.5*sc,1,8);wc(5*sc,-ry*.12,2.5*sc,1,8);wl(-20*sc,-ry*.04,-8*sc,-ry*.07,1);wl(20*sc,-ry*.04,8*sc,-ry*.07,1);g.restore();

function isInWindow(ex,ey){const{x,y,w,h}=winRect;return ex>=x&&ex<=x+w&&ey>=y&&ey<=y+h;}

function down2(ex,ey){
  mdown2=true;dsx2=ex;dsy2=ey;didDrag2=false;
  let best=null,bestY=-Infinity;
  for(const o of objs2d){if(o.hit&&o.hit(ex,ey)){const oy=o.y||0;if(oy>=bestY){bestY=oy;best=o;}}}
  if(best){drag2=best;best.onDragStart&&best.onDragStart(ex,ey);objs2d.splice(objs2d.indexOf(best),1);objs2d.push(drag2);}
}
function move2(ex,ey){
  const dx=ex-mx2,dy=ey-my2;mx2=ex;my2=ey;
  if(mdown2&&drag2){if(Math.abs(ex-dsx2)+Math.abs(ey-dsy2)>6)didDrag2=true;drag2.onDrag&&drag2.onDrag(dx,dy);}
}
function up2(ex,ey){
  mdown2=false;
  if(drag2){
    if(!didDrag2){
      drag2.onClick&&drag2.onClick(ex,ey);
    }
    drag2.onDragEnd&&drag2.onDragEnd();drag2=null;
    return;
  }
  if(!didDrag2&&isInWindow(ex,ey))enterWorld();
}
cv2d.addEventListener('mousemove',e=>{if(!worldActive)move2(e.clientX,e.clientY);});
cv2d.addEventListener('mousedown',e=>{if(!worldActive)down2(e.clientX,e.clientY);});
cv2d.addEventListener('mouseup',e=>{if(!worldActive)up2(e.clientX,e.clientY);});
cv2d.addEventListener('mouseleave',()=>{mdown2=false;if(drag2){drag2.onDragEnd&&drag2.onDragEnd();drag2=null;}});
cv2d.addEventListener('touchstart',e=>{e.preventDefault();if(!worldActive){const t=e.touches[0];down2(t.clientX,t.clientY);}},{passive:false});
cv2d.addEventListener('touchmove',e=>{e.preventDefault();if(!worldActive){const t=e.touches[0];move2(t.clientX,t.clientY);}},{passive:false});
cv2d.addEventListener('touchend',e=>{if(!worldActive){const t=e.changedTouches[0];up2(t.clientX,t.clientY);}});

window.addEventListener('resize',()=>{
  W=cv2d.width=document.documentElement.clientWidth||innerWidth;
  H=cv2d.height=document.documentElement.clientHeight||innerHeight;
  makeRoom();init2d();
  if(world3){world3.ren.setSize(Math.round(W*.4),Math.round(H*.4),false);const cv3d=document.getElementById('cv3d');cv3d.style.width=W+'px';cv3d.style.height=H+'px';world3.cam.aspect=W/H;world3.cam.updateProjectionMatrix();}
});

window.addEventListener('load',()=>{
  W=cv2d.width=document.documentElement.clientWidth||innerWidth;
  H=cv2d.height=document.documentElement.clientHeight||innerHeight;
  makeRoom();init2d();loop2d();
});
</script>
</body>
</html>
